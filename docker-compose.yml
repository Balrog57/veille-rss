name: veille
services:
  backend:
    image: 127.0.0.1:5500/veille-rss-backend:latest
    container_name: veille-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - /DATA/AppData/veille/data:/app/data
    env_file:
      - /DATA/AppData/veille/.env
    environment:
      - OLLAMA_URL=http://ai-stack-ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
      - TZ=Europe/Paris
      - DATABASE_PATH=/app/data/veille.sqlite
    networks:
      - default
      - ai_net

  frontend:
    image: 127.0.0.1:5500/veille-rss-frontend:latest
    container_name: veille-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - default

x-casaos:
  author: self
  category: Utilities
  hostname: 192.168.1.98
  icon: http://192.168.1.98:3000/veille-rss.png
  index: /
  is_uncontrolled: false
  main: frontend
  port_map: "3000"
  scheme: http
  store_app_id: veille
  title:
    custom: "Veille RSS"
    en_us: "Veille RSS"

networks:
  default:
    name: veille_default
  ai_net:
    name: ai_net
    external: true
